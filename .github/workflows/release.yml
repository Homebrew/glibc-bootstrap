name: Upload new release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to use for release tag
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # actionlint does not yet accept $/ workflow calls.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries from GitHub Actions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bootstrap-*
          path: bootstrap-binaries
          merge-multiple: true

      - name: Validate release
        run: bash .github/scripts/release.sh --validate-only
        env:
          TAG: ${{github.event.inputs.tag}}

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bootstrap-binaries/*.tar.gz

      - name: Create release
        run: bash .github/scripts/release.sh
        env:
          GH_TOKEN: ${{github.token}}
          TAG: ${{github.event.inputs.tag}}
