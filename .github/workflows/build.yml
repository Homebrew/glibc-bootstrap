name: Build bootstrap binaries for glibc on Linux

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check shell scripts
        run: |
          bash -n utils.sh
          shellcheck -x ./*.sh .github/scripts/*.sh
      - name: Test build and release helpers
        run: ruby -Itests -e 'Dir["tests/test_*.rb"].sort.each { |file| require_relative file }'
      - name: Select build validation
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/select-build.sh

  build:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        binary:
          - binutils
          - bison
          - gawk
          - gcc
          - make
          - python3
          - sed
        arch:
          - x86_64
          - arm64
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
            runtime: centos:6
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            runtime: centos:7
    runs-on: ${{matrix.runs-on}}
    name: ${{matrix.binary}} (${{matrix.arch}})
    env:
      ARCH: ${{matrix.arch}}
      BINARY: ${{matrix.binary}}
      RUNTIME: ${{matrix.runtime}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag glibc-bootstrap --file "Dockerfile.$ARCH" .

      - name: Run Docker container
        run: docker run --rm --detach --user linuxbrew --name "$GITHUB_SHA" --workdir /home/linuxbrew --volume "$(pwd):/home/linuxbrew/glibc-bootstrap:ro" glibc-bootstrap sleep inf

      - name: Build ${{matrix.binary}}
        run: docker exec "$GITHUB_SHA" /bin/bash -c "/home/linuxbrew/glibc-bootstrap/build-$BINARY.sh"

      - name: Copy binaries from container
        run: docker cp "$GITHUB_SHA":/home/linuxbrew/bootstrap-binaries .

      - name: Check packaged ELF files
        run: |
          mkdir unpacked
          tar --extract --file bootstrap-binaries/*.tar.gz --directory unpacked
          ruby .github/scripts/check-elf.rb "$ARCH" unpacked

      - name: Test binaries in the base runtime
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$(pwd)/unpacked:/tmp/homebrew:ro"
          --volume "$(pwd):/repo:ro" --workdir /tmp
          "$RUNTIME" /bin/bash /repo/test-binaries.sh "$BINARY"

      - name: Remove build container
        if: always()
        run: docker rm --force "$GITHUB_SHA"

      - name: Upload binaries to GitHub Actions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-${{matrix.arch}}-${{matrix.binary}}
          path: bootstrap-binaries
          if-no-files-found: error
          compression-level: 0

  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    name: Build glibc (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bootstrap-${{ matrix.arch }}-*
          path: bootstrap-binaries
          merge-multiple: true
      - name: Build and run glibc with the packaged toolchain
        run: bash .github/scripts/test-glibc.sh bootstrap-binaries

  check:
    name: Validate bootstrap binaries
    if: always()
    needs: [validate, build, integration]
    runs-on: ubuntu-slim
    steps:
      - name: Require successful validation
        env:
          VALIDATE: ${{ needs.validate.result }}
          BUILD_REQUIRED: ${{ needs.validate.outputs.build }}
          BUILD: ${{ needs.build.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          [[ "$VALIDATE" == success ]]
          case "$BUILD_REQUIRED" in
            true) [[ "$BUILD" == success && "$INTEGRATION" == success ]] ;;
            false) [[ "$BUILD" == skipped && "$INTEGRATION" == skipped ]] ;;
            *) exit 1 ;;
          esac
